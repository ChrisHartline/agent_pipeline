[metadata]
name = clara-prototype
version = 0.0.1
description = Clara prototype PEFT training utilities

[options]
packages =
    clara_prototype
    scripts
    cloud
package_dir =
    clara_prototype = src/clara_prototype
    scripts = scripts
    cloud = cloud
python_requires = >=3.10

[options.entry_points]
console_scripts =
    clara-peft = scripts.peft_train:main
    clara-vertex-submit = scripts.vertex_submit:main
