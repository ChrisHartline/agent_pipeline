name: CI - smoke

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what's needed for smoke tests (no torch/transformers)
          pip install pydantic>=2.0.0 numpy pytest
          pip install -e . --no-deps

      - name: Run smoke tests
        run: |
          # Run only tests that don't require torch/transformers
          pytest tests/test_imports.py tests/test_data_format.py tests/test_peft_cli_args.py tests/test_mergekit_runner.py -v --tb=short
