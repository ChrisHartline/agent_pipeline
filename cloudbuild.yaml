# Cloud Build configuration for Clara training container
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml
#
# This builds and pushes to Artifact Registry:
#   us-east1-docker.pkg.dev/celestinecircle/clara-training-repo/clara-train:latest

substitutions:
  _PROJECT_ID: celestinecircle
  _REGION: us-east1
  _REPOSITORY: clara-training-repo
  _IMAGE_NAME: clara-train
  _TAG: latest

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}'

# Store images in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for build (30 minutes should be plenty)
timeout: '1800s'
